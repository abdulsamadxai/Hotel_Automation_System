# Render Blueprint for the Hotel Automation System backend.
# Deploy: in the Render dashboard, New -> Blueprint, pick this repo.
# Render creates the database + web service below. This file creates no
# resources by itself — it only describes them.
#
# After the first deploy, the seed runs automatically as part of the build
# (the free plan has no Shell, so the seed cannot be run by hand).
# It uses SEED_DEMO_PASSWORD from the service's Environment — set that
# variable in the dashboard before deploying. The seed is idempotent
# (upserts), so re-running it on later deploys is safe and re-applies
# the demo password if it changed.

services:
  - type: web
    name: hotel-automation-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma migrate deploy && npm run build && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-automation-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: hotel-automation-db
    plan: free
