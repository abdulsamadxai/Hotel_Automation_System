# Render Blueprint for the Hotel Automation System backend.
# Deploy: in the Render dashboard, New -> Blueprint, pick this repo.
# Render creates the database + web service below. This file creates no
# resources by itself — it only describes them.
#
# After the first deploy, run the seed once from the web service's Shell:
#   npm run seed
# (with SEED_DEMO_PASSWORD set in the service's Environment first).

services:
  - type: web
    name: hotel-automation-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-automation-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: hotel-automation-db
    plan: free
